# Installed by exe-setup next to the unit that `t3 service install` writes; survives `t3 service update`.
# systemd user services get a minimal PATH, so the T3 server could not find Homebrew's cloudflared
# (its T3 Connect relay client) or the AI CLIs it launches.
[Service]
Environment=PATH=/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:%h/.local/bin:/usr/local/bin:/usr/bin:/bin

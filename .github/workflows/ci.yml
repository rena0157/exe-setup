name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y ruby shellcheck
      - name: Shell syntax
        run: for script in setup.sh bootstrap.sh exe-new.sh team-dev.sh scripts/*.sh backup/backup.sh tests/test.sh; do bash -n "$script"; done
      - name: ShellCheck
        run: shellcheck setup.sh bootstrap.sh exe-new.sh team-dev.sh scripts/*.sh backup/backup.sh tests/test.sh
      - name: Behavior and manifest tests
        run: tests/test.sh
      - name: Validate Brewfile syntax
        run: ruby -c Brewfile
      - name: Team provisioning tests
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
      - name: Validate systemd units
        run: systemd-analyze verify --user systemd/user/*.service systemd/user/*.timer || true
